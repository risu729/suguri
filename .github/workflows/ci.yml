name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: CI Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.6
          install_args: --locked
      - name: Install dependencies
        run: mise run install
      - name: Check repository
        run: mise run ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate the checked Worker with the shared deploy action
        uses: risu729/wrangler-deploy-action@c85532bf934238e9811676cbf10a4d08ff88ae12 # v3.0.0
        with:
          mode: dry-run
          worker: suguri
          build-mode: production
          production-strategy: versions
  actions-timeline:
    name: Generate Actions Timeline
    needs: [checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # Read this run's jobs for the timeline.
    steps:
      - uses: Kesin11/actions-timeline@460b1f8a750077029ad3589824d371b200e91dcf # v3.2.1
